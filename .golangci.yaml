version: "2"
run:
  issues-exit-code: 1
  tests: false

linters:
  default: all
  disable:
    - wsl
    - depguard
    - noinlineerr
    - nlreturn
    - wrapcheck
    - varnamelen
    - sqlclosecheck
    - revive
    - gosec
    - funlen
    - exhaustruct
    - dupword
    - ireturn
  settings:
    ireturn:
      allow:
        - HandlerT

    tagliatelle:
      case:
        rules:
          json: snake

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      disable:
        - return
    errcheck:
      check-type-assertions: true
      check-blank: true
    cyclop:
      max-complexity: 10

  exclusions:
    generated: lax
    rules:
      - linters:
          - cyclop
        path: _test\.go
      - linters:
          - cyclop
        path: setup\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: HEAD
  new: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test.go
